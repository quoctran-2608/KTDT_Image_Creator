              descriptor.set = function(v) {

          Object.defineProperty = function(obj, prop, descriptor) {
            return origDefineProp.call(Object, obj, prop, patchDescriptor(prop, descriptor));

            Reflect.defineProperty = function(target, prop, descriptor) {

            window,
            window.constructor ? window.constructor.prototype : null,
            Object.getPrototypeOf(window)
          ];

          for (var i = 0; i < targets.length; i++) {
            var target = targets[i];
            if (!target) continue;

                  var origGet = d.get;

                    },

                      customVal = v;
                    },
                    configurable: true,
                    enumerable: d.enumerable !== false
                  });
                })(target, desc);
              }
            } catch (e) {}
          }
        } catch (err) {}
      })();
